function canEq(eid,cid){const e=EQ.find(x=>x.id===eid);if(!e)return false;if(!e.cls)return true;return e.cls.includes(cid);}
function eqB(eid,st){const e=EQ.find(x=>x.id===eid);return(e&&e.stat===st)?e.bonus:0;}
function gC(c){return c.combat+eqB(c.weapon,"combat")+eqB(c.armor,"combat")+eqB(c.accessory,"combat");}
function gI(c){return c.intel+eqB(c.weapon,"intel")+eqB(c.armor,"intel")+eqB(c.accessory,"intel");}
function gCh(c){return c.charm+eqB(c.weapon,"charm")+eqB(c.armor,"charm")+eqB(c.accessory,"charm");}

function gid(){return Math.random().toString(36).substr(2,9);}
function genQ(si,cur,mx){const ts=getQF(si);const av=cur.filter(q=>q.status==="available");const t=Math.max(0,(mx||3)-av.length);const nq=[];const used=new Set(cur.map(q=>q.title));const avail=ts.filter(x=>!used.has(x.title));for(let i=0;i<t&&avail.length>0;i++){const idx=Math.floor(Math.random()*avail.length);const tp=avail.splice(idx,1)[0];nq.push({id:gid(),...tp,deadline:4+Math.floor(Math.random()*5),status:"available",assignedChars:[],remainingDays:tp.days,expanded:false});}return nq;}
function rollRw(ig){const r=Math.random()*100;if(ig){if(r<50)return 3;if(r<85)return 4;return 5;}if(r<70)return 1;return 2;}
const RWM={1:1.0,2:1.2,3:2.0,4:2.3,5:2.6};const RWL={1:"成功",2:"成功+",3:"大成功",4:"大成功+",5:"大成功!!"};
const LVXP=[0,10,25,50,80,120,170,230,300,400,520];
function failRate(tC,tI,tCh,q){let s=0;if(tC<q.combat)s+=q.combat-tC;if(tI<q.intel)s+=q.intel-tI;if(tCh<q.charm)s+=q.charm-tCh;return Math.min(s*5,95);}
function questIcon(q){const mx=Math.max(q.combat,q.intel,q.charm);const diff=mx-Math.min(q.combat,q.intel,q.charm);if(diff<10)return"⚖️";if(mx===q.combat)return"⚔️";if(mx===q.intel)return"📖";return"✨";}

  const checkSc=useCallback((g,r,cs,d)=>{
    if(!s0||sRes)return;const req=s0.req;const mem=cs.filter(c=>c.status!=="retired").length;
    let cgl=0;for(let i=GL.length-1;i>=0;i--){if(r>=GL[i]){cgl=i;break;}}
    let ok=true;if(req.gold&&g<req.gold)ok=false;if(req.guildLevel&&cgl<req.guildLevel)ok=false;if(req.minMembers&&mem<req.minMembers)ok=false;
    if(ok){setSRes("success");setDlg({type:"sc_end",result:"success"});return;}
    if(d>=s0.deadline){setSRes("failure");setDlg({type:"sc_end",result:"failure"});}
  },[s0,sRes]);

  const advDay=useCallback(()=>{
    if(sRes)return;
    setTransition(true);
    setTimeout(()=>{
      let nd=day+1,nm=mo,ny=yr;if(nd>30){nd=1;nm++;}if(nm>12){nm=1;ny++;}
      setDay(nd);setMo(nm);setYr(ny);const nSD=sD+1;setSD(nSD);
      const comp=[];let gUp=false;const nl=[];let nGl=gl;let nRep=rep;let nGold=gold;
      setChars(prev=>prev.map(c=>{if(c.status==="resting"){const rd=(c.restDays||1)-1;if(rd<=0)return{...c,status:"active",restDays:0};return{...c,restDays:rd};}return c;}));
      const uq=quests.map(q=>{
        if(q.status==="dispatched"){const rm=q.remainingDays-1;
          if(rm<=0){const ag=q.assignedChars.map(id=>chars.find(x=>x.id===id)).filter(Boolean);const tC=ag.reduce((s,c)=>s+gC(c),0),tI=ag.reduce((s,c)=>s+gI(c),0),tCh=ag.reduce((s,c)=>s+gCh(c),0);
            const fr=failRate(tC,tI,tCh,q);const failed=fr>0&&Math.random()*100<fr;
            if(failed){const fg=Math.floor(q.gold*0.25);nGold+=fg;nRep=Math.max(0,nRep-1);
              setChars(prev=>prev.map(c=>q.assignedChars.includes(c.id)?{...c,status:"active"}:c));
              comp.push({title:q.title,rewardLv:-1,gold:fg,rep:-1,levelUps:[],fatigued:[],guildLevelUp:false,failed:true,baseGold:q.gold});return{...q,status:"completed"};}
            const ig=tC>=q.combat*1.5&&tI>=q.intel*1.5&&tCh>=q.charm*1.5;const rlv=rollRw(ig);const fg=Math.floor(q.gold*RWM[rlv]);
            const xg=q.rep*5+RANKS.indexOf(q.rank)*3;const lus=[];const fatigued=[];
            setChars(prev=>prev.map(c=>{if(q.assignedChars.includes(c.id)){const nx=c.xp+xg;let nc={...c,xp:nx,status:"active"};let nv=nc.level;
              while(nv<LVXP.length-1&&nx>=LVXP[nv+1]){nv++;nc={...nc,level:nv,combat:nc.combat+2,intel:nc.intel+1,charm:nc.charm+1};lus.push({name:c.name,level:nv});}
              if((q.fatD||0)>0&&Math.random()<(FAT[c.classId]||0.2)){nc.status="resting";nc.restDays=q.fatD;fatigued.push(c.name);}return nc;}return c;}));
            nGold+=fg;nRep+=q.rep;const nxLv=nGl+1;if(nxLv<GL.length&&nRep>=GL[nxLv]){nGl=nxLv;gUp=true;}
            comp.push({title:q.title,rewardLv:rlv,gold:fg,rep:q.rep,levelUps:lus,fatigued,guildLevelUp:false,failed:false,baseGold:q.gold});return{...q,status:"completed"};}
          return{...q,remainingDays:rm};}
        if(q.status==="available"){const dl=q.deadline-1;if(dl<=0){nl.push({text:`⌛「${q.title}」の受注期限が過ぎました`,isExp:true});return{...q,status:"expired"};}return{...q,deadline:dl};}return q;});
      setGold(nGold);setRep(nRep);setGl(nGl);if(gUp&&comp.length>0)comp[comp.length-1].guildLevelUp=true;
      const rm=uq.filter(q=>q.status==="available"||q.status==="dispatched");setQuests([...rm,...genQ(si,rm,maxQ)]);
      if(nl.length>0)setLogs(p=>[...nl,...p].slice(0,50));if(comp.length>0)setPRes(comp);
      setTimeout(()=>{setTransition(false);checkSc(nGold,nRep,chars,nSD);},400);
    },500);

    const names=aIds.map(id=>chars.find(c=>c.id===id)?.name).filter(Boolean).join("と");

    let newPool=[...pool];let newChars=[...chars];

      {dlg?.type==="dispatched"&&<Dialog onClose={()=>{setDlg(null);chSc("home");}} btnText="確認"><RecSays text={`「${dlg.title}」の依頼に、${dlg.names}を派遣いたしました。無事に帰ってきてくれるといいですね。`} rn={rName}/></Dialog>}
      {dlg?.type==="confirmDay"&&<Dialog btnText={null} onClose={()=>setDlg(null)}><RecSays text={disp.length===0&&avC.length>0?`${mt}、きょうはまだ依頼を受けていらっしゃいませんが、よろしいのですか？`:`${mt}、きょうのお仕事はこれまでにいたしますか？`} rn={rName}/><div style={{display:"flex",gap:8,marginTop:12}}><button onClick={()=>{setDlg(null);advDay();}} style={{...bp,flex:1}}>はい</button><button onClick={()=>setDlg(null)} style={{...bb,flex:1}}>いいえ</button></div></Dialog>}

        {(()=>{const succ=pRes.filter(r=>!r.failed).length;const fail=pRes.filter(r=>r.failed).length;const great=pRes.filter(r=>r.rewardLv>=3).length;
          let msg="";if(fail===0&&great>0)msg=`${mt}、昨日の依頼は大成功でございました！ とっても感謝していただけましたよ！`;
          else if(fail===0)msg=`${mt}、昨日の依頼は無事に成功いたしました。`;

          else msg=`${mt}、昨日は成功が${succ}件、失敗が${fail}件でございました。`;
          return (<div style={{fontSize:14,color:T.text,textAlign:"center",fontStyle:"italic",marginBottom:16,lineHeight:1.6}}>{msg}</div>);})()}
        {pRes.map((r,i)=>(<div key={i} style={{background:r.failed?`${T.red}12`:"rgba(40,80,120,0.15)",border:`1px solid ${r.failed?T.red:T.green}33`,borderRadius:10,padding:14,marginBottom:10}}>

          <div style={{fontSize:14,color:r.failed?T.red:r.rewardLv>=3?T.blue:T.gold,fontWeight:"bold"}}>💰 {r.gold.toLocaleString()}G{r.failed?" （基本報酬の25%）":r.rewardLv>=3?` （+${Math.round((RWM[r.rewardLv]-1)*100)}%）`:r.rewardLv===2?` （+${Math.round((RWM[2]-1)*100)}%）`:""}</div>

          {r.fatigued?.length>0&&r.fatigued.map((fn,j)=>(<div key={j} style={{fontSize:12,color:T.orange}}>😴 {fn}は休息が必要になりました</div>))}

        <div style={ps}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontSize:13,color:T.td}}>🗡️ ギルドメンバー</span>

            <StatBar label="⚔️ 戦闘力" current={cls.combat} required={0} color={T.red} maxRef={mxR}/><StatBar label="📖 知力" current={cls.intel} required={0} color={T.blue} maxRef={mxR}/><StatBar label="✨ 魅力" current={cls.charm} required={0} color={T.purple} maxRef={mxR}/></div></div>
          <button onClick={createChar} style={cN.trim()?{...bp,width:"100%",fontSize:15}:bd} disabled={!cN.trim()}>✅ 登録する</button>

        {chars.filter(c=>c.status!=="retired").length>0&&(<div style={{...ps,marginTop:14}}><div style={{fontSize:13,color:T.td,marginBottom:8}}>登録済みメンバー</div>

      }} style={{...bp,flex:1,background:`linear-gradient(180deg,${T.red},#802020)`}}>はい</button><button onClick={()=>setDlg(null)} style={{...bb,flex:1}}>いいえ</button></div></Dialog>}
      {dlg?.type==="msg"&&<Dialog onClose={()=>setDlg(null)} btnText="確認"><RecSays text={dlg.text} rn={rName}/></Dialog>}

          <div style={{fontSize:20,color:T.tb,fontWeight:"bold",marginTop:10}}>{c.name}</div>
          <div style={{fontSize:14,color:T.td}}>Lv.{c.level} {c.className}（{c.gender}）</div>
          <div style={{fontSize:12,color:c.status==="resting"?T.orange:c.status==="dispatched"?T.gold:T.green,marginTop:4,fontWeight:"bold"}}>
            {c.status==="resting"?`😴 休息中（残り${c.restDays}日）`:c.status==="dispatched"?"📤 派遣中":"✅ 待機中"}</div></div>
        <div style={ps}><div style={{fontSize:13,color:T.td,marginBottom:8}}>能力値</div>
          <StatBar label="⚔️ 戦闘力" current={gC(c)} required={0} color={T.red} maxRef={mxR}/>
          <StatBar label="📖 知力" current={gI(c)} required={0} color={T.blue} maxRef={mxR}/>
          <StatBar label="✨ 魅力" current={gCh(c)} required={0} color={T.purple} maxRef={mxR}/></div>
        <div style={ps}><div style={{fontSize:13,color:T.td,marginBottom:8}}>装備</div>
          {[["weapon","⚔️ 武器"],["armor","🛡️ 防具"],["accessory","💍 アクセサリ"]].map(([slot,label])=>{
            const eqId=c[slot];const item=eqId?EQ.find(x=>x.id===eqId):null;
            const avail=pool.filter(p=>p.assignedTo===null&&EQ.find(e=>e.id===p.eqId)?.type===slot&&canEq(p.eqId,c.classId));
            return(<div key={slot} style={{marginBottom:10,padding:"8px 0",borderBottom:`1px solid ${T.pb}22`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13}}>
                <span style={{color:T.td}}>{label}</span>
                <span style={{color:item?T.tb:T.td,fontWeight:item?"bold":"normal"}}>{item?`${item.name}（${item.desc}）`:"なし"}</span></div>
              <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                {item&&<button onClick={()=>{setPool(p=>p.map(x=>x.eqId===eqId&&x.assignedTo===c.id?{...x,assignedTo:null}:x));setChars(p=>p.map(x=>x.id===c.id?{...x,[slot]:null}:x));}} style={{...bb,padding:"4px 12px",fontSize:11}}>外す</button>}
                {avail.map((p,i)=>{const e=EQ.find(x=>x.id===p.eqId);return(<button key={i} onClick={()=>{
                  if(c[slot])setPool(pr=>pr.map(x=>x.eqId===c[slot]&&x.assignedTo===c.id?{...x,assignedTo:null}:x));
                  setPool(pr=>{const np=[...pr];const idx=np.findIndex(x=>x.eqId===p.eqId&&x.assignedTo===null);if(idx>=0)np[idx]={...np[idx],assignedTo:c.id};return np;});
                  setChars(pr=>pr.map(x=>x.id===c.id?{...x,[slot]:p.eqId}:x));
                }} style={{...bb,padding:"4px 12px",fontSize:11}}>{e?.name}</button>);})}
              </div>
            </div>);
          })}
        </div>
        {c.status==="active"&&<button onClick={()=>setDlg({type:"confirmRetire"})} style={{...bb,width:"100%",color:T.red,borderColor:`${T.red}66`,marginTop:8}}>🚪 {c.name}を引退させる</button>}
      </div></div>);
  }

  // ===== SHOP =====
  if(sc==="shop"){return(<div style={cs}>
    {dlg?.type==="confirmBuy"&&<Dialog btnText={null} onClose={()=>setDlg(null)}><RecSays text={`${dlg.item.price}ゴールドの「${dlg.item.name}」を購入なさいますか？\n\n${dlg.item.desc}の効果がございます。`} rn={rName}/><div style={{display:"flex",gap:8,marginTop:12}}><button onClick={()=>{setGold(g=>g-dlg.item.price);setPool(p=>[...p,{eqId:dlg.item.id,assignedTo:null}]);setDlg({type:"msg",text:`「${dlg.item.name}」を購入いたしました！ ギルドの共有在庫に追加されましたよ。`});}} style={{...bp,flex:1}}>はい</button><button onClick={()=>setDlg(null)} style={{...bb,flex:1}}>いいえ</button></div></Dialog>}
    {dlg?.type==="msg"&&<Dialog onClose={()=>setDlg(null)} btnText="確認"><RecSays text={dlg.text} rn={rName}/></Dialog>}
    <div style={hs}><button onClick={()=>chSc("home")} style={{...bb,padding:"6px 14px",fontSize:13}}>← 戻る</button><span style={{color:T.gold,fontWeight:"bold",fontSize:14}}>🏪 商店</span><span style={{color:T.gb,fontSize:14,fontWeight:"bold"}}>💰 {gold.toLocaleString()} G</span></div>
    <div style={bs}>
      <RecSays text={`${mt}、装備品をお求めでしたらお声がけくださいませ。`} rn={rName} help={true} onHelp={()=>setDlg({type:"help",text:"武器・防具・アクセサリはギルドの共有財産として管理されます。\n\nどの冒険者にどの装備を着けさせるかは、冒険者詳細画面でお選びいただけます。\n\nクラスによって装備できないものもございますので、ご注意くださいませ。"})}/>
      {["weapon","armor","accessory"].map(type=>(<div key={type} style={ps}><div style={{fontSize:14,color:T.td,marginBottom:8,fontWeight:"bold"}}>{type==="weapon"?"⚔️ 武器":type==="armor"?"🛡️ 防具":"💍 アクセサリ"}</div>
        {EQ.filter(i=>i.type===type).map(item=>{const owned=pool.filter(p=>p.eqId===item.id).length;return(<div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${T.pb}22`}}>
          <div><div style={{fontSize:14,color:T.tb}}>{item.name} {owned>0&&<span style={{fontSize:11,color:T.accent}}>（所持:{owned}）</span>}</div><div style={{fontSize:11,color:T.td}}>{item.desc}{item.cls?` ［${item.cls.map(c=>CLS[c]?.name).join("・")}］`:""}</div></div>
          <button onClick={()=>{if(gold>=item.price)setDlg({type:"confirmBuy",item});}} style={gold>=item.price?{...bb,padding:"6px 14px",fontSize:13}:bd}>{item.price} G</button>
        </div>);})}</div>))}
      {pool.length>0&&(<div style={ps}><div style={{fontSize:14,color:T.td,marginBottom:8,fontWeight:"bold"}}>📦 ギルド装備一覧</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{borderBottom:`1px solid ${T.pb}`}}><th style={{textAlign:"left",padding:"4px 0",color:T.td}}>装備名</th><th style={{textAlign:"left",padding:"4px 0",color:T.td}}>効果</th><th style={{textAlign:"left",padding:"4px 0",color:T.td}}>装備者</th></tr></thead>
          <tbody>{pool.map((p,i)=>{const e=EQ.find(x=>x.id===p.eqId);const owner=p.assignedTo?chars.find(c=>c.id===p.assignedTo):null;return(<tr key={i} style={{borderBottom:`1px solid ${T.pb}22`}}><td style={{padding:"6px 0",color:T.tb}}>{e?.name}</td><td style={{padding:"6px 0",color:T.td}}>{e?.desc}</td><td style={{padding:"6px 0",color:owner?T.accent:T.td}}>{owner?owner.name:"未装備"}</td></tr>);})}</tbody></table>
      </div>)}
    </div></div>);
  }

  // ===== QUEST BOARD =====
  if(sc==="questBoard"){const avail=quests.filter(q=>q.status==="available");
    return(<div style={cs}><div style={hs}><button onClick={()=>chSc("home")} style={{...bb,padding:"6px 14px",fontSize:13}}>← 戻る</button><span style={{color:T.gold,fontWeight:"bold",fontSize:14}}>📋 依頼ボード</span><span style={{fontSize:12,color:T.td}}>{avail.length}件</span></div>
      <div style={bs}>
        <RecSays text={`${mt}、こちらが現在の依頼でございます。気になる依頼をタップして詳細をご確認くださいませ。`} rn={rName}/>
        {avail.map(q=>{const qi=questIcon(q);return(<div key={q.id} style={{background:T.cardBg,border:`1px solid ${RC[q.rank]}44`,borderRadius:12,padding:14,marginBottom:10}}>
          <div onClick={()=>setQuests(p=>p.map(x=>x.id===q.id?{...x,expanded:!x.expanded}:x))} style={{cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:16}}>{qi}</span>
              <span style={{color:RC[q.rank],fontWeight:"bold",fontSize:12}}>Lv.{q.rank}</span>
              <span style={{color:T.tb,fontSize:14,fontWeight:"bold"}}>{q.title}</span></div>
              <span style={{fontSize:10,color:T.td}}>{q.expanded?"▲":"▼"}</span></div>
            <div style={{display:"flex",gap:10,fontSize:11,color:T.td,marginTop:4}}>
              <span>🕐 {q.days}日</span><span>💰 {q.gold}G</span><span>⭐ +{q.rep}</span>
              <span style={{color:q.deadline<=3?T.red:T.td}}>期限{q.deadline}日</span>
              {(q.fatD||0)>0&&<span style={{color:T.orange}}>😴 疲労あり</span>}</div></div>
          {q.expanded&&(<div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${T.pb}22`}}>
            <p style={{fontSize:13,color:T.text,lineHeight:1.8,margin:"0 0 10px"}}>{q.desc}</p>
            <StatBar label="⚔️ 戦闘力" current={0} required={q.combat} color={T.red} maxRef={100}/>
            <StatBar label="📖 知力" current={0} required={q.intel} color={T.blue} maxRef={100}/>
            <StatBar label="✨ 魅力" current={0} required={q.charm} color={T.purple} maxRef={100}/>
            <button onClick={()=>{setSelQ(q);setAIds([]);chSc("assign");}} style={{...bp,width:"100%",marginTop:8,fontSize:14}}>冒険者をアサインする</button>
          </div>)}</div>);})}
      </div></div>);
  }

  // ===== ASSIGN =====
  if(sc==="assign"&&selQ){const q=selQ;const asg=aIds.map(id=>chars.find(c=>c.id===id)).filter(Boolean);
    const tC=asg.reduce((s,c)=>s+gC(c),0),tI=asg.reduce((s,c)=>s+gI(c),0),tCh=asg.reduce((s,c)=>s+gCh(c),0);
    const met=tC>=q.combat&&tI>=q.intel&&tCh>=q.charm;const fr=aIds.length>0?failRate(tC,tI,tCh,q):0;const mxR2=Math.max(q.combat,q.intel,q.charm,40);
    return(<div style={cs}>
      {dlg?.type==="confirmDispatch"&&<Dialog btnText={null} onClose={()=>setDlg(null)}>
        <RecSays text={fr>0?`${mt}、この依頼は能力値が不足しております。\n失敗する確率は${fr}%でございます。\n\nそれでも派遣なさいますか？`:`${mt}、準備万端でございます！\n派遣してよろしいですか？`} rn={rName}/>
        <div style={{display:"flex",gap:8,marginTop:12}}><button onClick={()=>{setDlg(null);dispatch();}} style={{...bp,flex:1}}>はい</button><button onClick={()=>setDlg(null)} style={{...bb,flex:1}}>いいえ</button></div></Dialog>}
      <div style={hs}><button onClick={()=>{setSelQ(null);chSc("questBoard");}} style={{...bb,padding:"6px 14px",fontSize:13}}>← 戻る</button><span style={{color:T.gold,fontWeight:"bold",fontSize:14}}>アサイン</span><div/></div>
      <div style={bs}>
        <div style={{...ps,position:"sticky",top:52,zIndex:5,borderColor:`${RC[q.rank]}44`}}>
          <div style={{fontSize:14,color:T.tb,fontWeight:"bold",marginBottom:6}}>{questIcon(q)} {q.title}</div>
          <StatBar label="⚔️ 戦闘力" current={tC} required={q.combat} color={T.red} maxRef={mxR2}/>
          <StatBar label="📖 知力" current={tI} required={q.intel} color={T.blue} maxRef={mxR2}/>
          <StatBar label="✨ 魅力" current={tCh} required={q.charm} color={T.purple} maxRef={mxR2}/>
          {fr>0&&aIds.length>0&&<div style={{fontSize:12,color:T.red,marginTop:3,fontWeight:"bold"}}>⚠️ 失敗確率: {fr}%</div>}
          <button onClick={()=>{if(aIds.length>0)setDlg({type:"confirmDispatch"});}} disabled={aIds.length===0} style={aIds.length>0?{...bp,width:"100%",marginTop:8,fontSize:14}:{...bd,width:"100%",marginTop:8}}>
            {met?"⚔️ 派遣する！":aIds.length>0?"⚠️ 派遣する（能力値に不足あり）":"冒険者を選択してください"}</button></div>
        <div style={ps}><div style={{fontSize:13,color:T.td,marginBottom:8}}>待機中の冒険者: {avC.length}人</div>
          {avC.map(c=>{const sel=aIds.includes(c.id);return(<div key={c.id} onClick={()=>setAIds(p=>sel?p.filter(id=>id!==c.id):[...p,c.id])} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"10px 8px",marginBottom:4,borderRadius:10,cursor:"pointer",background:sel?`${T.accent}15`:"transparent",border:`1px solid ${sel?T.accent:T.pb}44`}}>
            <Pt cid={c.classId} g={c.gender} sz="sm"/>
            <div style={{flex:1}}><div style={{fontSize:13,color:T.tb,fontWeight:"bold"}}>{c.name} <span style={{color:T.td,fontWeight:"normal",fontSize:11}}>Lv.{c.level}</span></div>
              <StatBar label="⚔️ 戦闘力" current={gC(c)} required={0} color={T.red} maxRef={mxR2}/>
              <StatBar label="📖 知力" current={gI(c)} required={0} color={T.blue} maxRef={mxR2}/>
              <StatBar label="✨ 魅力" current={gCh(c)} required={0} color={T.purple} maxRef={mxR2}/></div>
            <span style={{fontSize:20,color:sel?T.accent:T.pb,marginTop:8}}>{sel?"✓":"○"}</span></div>);})}</div>
      </div></div>);
  }

  return null;
}


ReactDOM.createRoot(document.getElementById('root')).render(<GuildGame />);
</script>
</body>
</html>
